<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Boisset43</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%; }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; margin-bottom: 25px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 12px; background-color: #3ecf8e; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #36b37a; }
        #message { margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Espace Pro</h1>
        <p>Saisis ton email pour recevoir un lien de connexion magique.</p>
        <input type="email" id="email" placeholder="nom@exemple.com">
        <button onclick="sendMagicLink()">Recevoir le lien</button>
        <p id="message"></p>
    </div>

    <script>
        const supabaseUrl = 'https://nwrjlkmvdgubifvqbdkx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cmpsa212ZGd1YmlmdnFiZGt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTQxODMsImV4cCI6MjA5MDQ3MDE4M30.64NvGf11u_BDe6O_kP6trCuxefiAsD9kQyl9LZB9mwU';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        async function sendMagicLink() {
            const email = document.getElementById('email').value;
            const msgElement = document.getElementById('message');
            
            const { error } = await supabaseClient.auth.signInWithOtp({
                email: email,
                options: {
                    emailRedirectTo: 'https://boisset43.vercel.app/edit.html'
                }
            });

            if (error) {
                msgElement.style.color = "#e74c3c";
                msgElement.innerText = "Erreur : " + error.message;
            } else {
                msgElement.style.color = "#27ae60";
                msgElement.innerText = "Lien envoyé ! Vérifie tes mails (et tes spams).";
            }
        }
    </script>
</body>
</html>
