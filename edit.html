<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modifier ma fiche - Boisset43</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f9f9f9; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 2px 15px rgba(0,0,0,0.05); }
        h2 { border-bottom: 2px solid #3ecf8e; padding-bottom: 10px; color: #333; }
        label { display: block; margin-top: 20px; font-weight: 600; color: #555; }
        input { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 30px; width: 100%; padding: 15px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background: #000; }
        #status { margin-top: 20px; text-align: center; font-weight: bold; }
        .nav-link { display: block; margin-top: 20px; text-align: center; color: #3ecf8e; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🔧 Gérer ma notification</h2>
        <p id="user-info">Vérification de la session...</p>

        <div id="form-area" style="display:none;">
            <label>Texte de l'alerte (Pastille)</label>
            <input type="text" id="event_text" placeholder="Ex: Bal masqué le 25 juillet">

            <label>Lien de redirection (Optionnel)</label>
            <input type="url" id="event_link" placeholder="https://votre-site.fr/page-event">

            <label>Date de fin (La pastille disparaîtra après)</label>
            <input type="date" id="event_expiry">

            <button onclick="saveData()">Mettre à jour mon profil</button>
        </div>
        <p id="status"></p>
        <a href="https://boisset43.vercel.app" class="nav-link">← Retour au site</a>
    </div>

    <script>
        const supabaseUrl = 'https://nwrjlkmvdgubifvqbdkx.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im53cmpsa212ZGd1YmlmdnFiZGt4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ4OTQxODMsImV4cCI6MjA5MDQ3MDE4M30.64NvGf11u_BDe6O_kP6trCuxefiAsD9kQyl9LZB9mwU';
        const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        let userEmail = "";

        async function init() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                userEmail = session.user.email;
                document.getElementById('user-info').innerText = "Connecté : " + userEmail;
                document.getElementById('form-area').style.display = "block";
                loadData();
            } else {
                document.getElementById('user-info').innerHTML = "<span style='color:red'>Accès refusé.</span> Tu dois utiliser le lien reçu par mail.";
            }
        }

        async function loadData() {
            const { data, error } = await supabaseClient
                .from('local_directory')
                .select('*')
                .eq('owner_email', userEmail)
                .single();

            if (data) {
                document.getElementById('event_text').value = data.event_text || "";
                document.getElementById('event_link').value = data.event_link || "";
                if (data.event_expiry) {
                    document.getElementById('event_expiry').value = data.event_expiry.split('T')[0];
                }
            }
        }

        async function saveData() {
            const status = document.getElementById('status');
            const { error } = await supabaseClient
                .from('local_directory')
                .update({ 
                    event_text: document.getElementById('event_text').value, 
                    event_link: document.getElementById('event_link').value, 
                    event_expiry: document.getElementById('event_expiry').value || null 
                })
                .eq('owner_email', userEmail);

            if (error) {
                status.style.color = "red";
                status.innerText = "❌ Erreur : " + error.message;
            } else {
                status.style.color = "green";
                status.innerText = "✅ Changements enregistrés avec succès !";
            }
        }

        init();
    </script>
</body>
</html>
